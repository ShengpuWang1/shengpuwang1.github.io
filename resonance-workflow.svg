<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" role="img" aria-labelledby="title"><title id="title">Resonance extraction workflow</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#245c9c"/></marker></defs><rect width="560" height="470" fill="white"/><rect x="75" y="35" width="410" height="56" rx="5" fill="#f5f7fa" stroke="#dce3eb"/><text x="280" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#152238">Complex transmission data</text><text x="280" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#526174">Use both amplitude and phase</text><path d="M280 92v17" stroke="#245c9c" fill="none" marker-end="url(#a)"/><rect x="75" y="111" width="410" height="56" rx="5" fill="#f5f7fa" stroke="#dce3eb"/><text x="280" y="134" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#152238">Cable-delay correction</text><text x="280" y="154" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#526174">Recover the complex-plane geometry</text><path d="M280 168v17" stroke="#245c9c" fill="none" marker-end="url(#a)"/><rect x="75" y="187" width="410" height="56" rx="5" fill="#f5f7fa" stroke="#dce3eb"/><text x="280" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#152238">Hough circle detection</text><text x="280" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#526174">Locate and extend candidate regions</text><path d="M280 244v17" stroke="#245c9c" fill="none" marker-end="url(#a)"/><rect x="75" y="263" width="410" height="56" rx="5" fill="#f5f7fa" stroke="#dce3eb"/><text x="280" y="286" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#152238">Resonance fitting</text><text x="280" y="306" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#526174">Estimate frequency and quality factor</text><path d="M280 320v17" stroke="#245c9c" fill="none" marker-end="url(#a)"/><rect x="75" y="339" width="410" height="56" rx="5" fill="#f5f7fa" stroke="#dce3eb"/><text x="280" y="362" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#152238">Quality filtering and mode tracking</text><text x="280" y="382" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#526174">Reject uncertain fits; compare temperatures</text></svg>