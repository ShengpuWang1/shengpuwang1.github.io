<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 505" role="img" aria-labelledby="title"><title id="title">Hybrid quantum-classical training loop</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#245c9c"/></marker></defs><rect width="560" height="505" fill="white"/><rect x="75" y="35" width="410" height="56" rx="5" fill="#f5f7fa" stroke="#dce3eb"/><text x="280" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#152238">Parameterized quantum circuit</text><text x="280" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#526174">Prepared states on a 4- or 9-qubit processor</text><path d="M280 92v17" stroke="#245c9c" fill="none" marker-end="url(#a)"/><rect x="75" y="111" width="410" height="56" rx="5" fill="#f5f7fa" stroke="#dce3eb"/><text x="280" y="134" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#152238">Quantum measurements</text><text x="280" y="154" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#526174">Sample the circuit output</text><path d="M280 168v17" stroke="#245c9c" fill="none" marker-end="url(#a)"/><rect x="75" y="187" width="410" height="56" rx="5" fill="#f5f7fa" stroke="#dce3eb"/><text x="280" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#152238">Classical post-processing</text><text x="280" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#526174">Map measurement outcomes to a prediction</text><path d="M280 244v17" stroke="#245c9c" fill="none" marker-end="url(#a)"/><rect x="75" y="263" width="410" height="56" rx="5" fill="#f5f7fa" stroke="#dce3eb"/><text x="280" y="286" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#152238">Classification cost</text><text x="280" y="306" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#526174">Evaluate against the training labels</text><path d="M280 320v17" stroke="#245c9c" fill="none" marker-end="url(#a)"/><rect x="75" y="339" width="410" height="56" rx="5" fill="#f5f7fa" stroke="#dce3eb"/><text x="280" y="362" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#152238">Evolutionary optimizer</text><text x="280" y="382" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#526174">Update circuit parameters</text><path d="M75 367H35V63H73" stroke="#245c9c" stroke-width="1.5" fill="none" marker-end="url(#a)"/><text x="280" y="482" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#526174">Iterate with updated parameters</text></svg>